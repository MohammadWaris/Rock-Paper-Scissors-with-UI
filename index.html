<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div class="container" id="container">
        <h1 class="title">Rock Paper Scissors</h1>
        <div class="choice">
            <button class="btn" id="rock">Rock</button>
            <button class="btn" id="paper">Paper</button>
            <button class="btn" id="scissors"> Scissors</button>
        </div>
        <p class="text-info">Make you move!</p>
        <div class="scores">
            <p>You: <span class="userScore" id="userScore">0</span> </p> | 
            <p>Computer: <span class="computerScore" id="computerScore">0</span> </p>
        </div>
        <div class="refresh">
            <button type="button" id="refresh">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#1f1f1f"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82
                    2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
        </div>
    </div>
    <script src="custome.js"></script>
</body>
</html>
